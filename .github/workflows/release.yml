name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop
    uses: ./.github/workflows/release-windows.yml
    secrets: inherit

  macos:
    name: macOS desktop
    uses: ./.github/workflows/release-macos.yml
    secrets: inherit

  android:
    name: Android
    uses: ./.github/workflows/release-android.yml
    secrets: inherit

  release:
    name: GitHub Release
    needs: [windows, macos, android]
    if: always() && startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download successful platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Prism-*
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
