name: Windows Desktop Build
on:
  workflow_call:
permissions:
  contents: read
env:
  WAILS3_VERSION: v3.0.0-alpha.82
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            goos: windows
            artifact: Prism-desktop-windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Fill about placeholders
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          fi
          if [[ -z "${TAG}" ]]; then
            echo "no v* tag" >&2
            exit 1
          fi
          WEBSITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          FILE="frontend/src/components/SettingPanel.vue"
          VERSION="${TAG#v}"
          sed -i.bak "s|<version>|${TAG}|g" "$FILE"
          sed -i.bak "s|<website>|${WEBSITE}|g" "$FILE"
          rm -f "${FILE}.bak"
          sed -i.bak "s/\"file_version\": \"[^\"]*\"/\"file_version\": \"${VERSION}\"/" build/windows/info.json
          sed -i.bak "s/\"ProductVersion\": \"[^\"]*\"/\"ProductVersion\": \"${VERSION}\"/" build/windows/info.json
          rm -f build/windows/info.json.bak

      - name: Package
        run: wails3 package

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.goos }}" in
            windows)
              installer="$(ls bin/*-installer.exe | head -n 1)"
              cp "$installer" "dist/${{ matrix.artifact }}-installer.exe"
              ;;
          esac
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14
