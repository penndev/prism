<!DOCTYPE html>
<html lang="zh-CN" class="i18n-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism</title>
    <meta
      name="description"
      content="Prism 代理客户端下载站。桌面端支持 SOCKS5 / HTTP，手动模式与 TUN；移动端走本地 VPN。"
    />
    <link rel="canonical" href="https://penndev.github.io/prism/" />
    <meta name="theme-color" content="#0088cc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <noscript>
      <style>
        html.i18n-pending main,
        html.i18n-pending footer {
          visibility: visible;
        }
      </style>
    </noscript>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#">
        <img src="./logo.svg" width="32" height="32" alt="" />
        <span>Prism</span>
      </a>
      <nav>
        <a href="#download" data-i18n="navDownload"></a>
        <a href="#proxy" data-i18n="navProxy"></a>
        <a href="#rules" data-i18n="navRules"></a>
        <a href="#other" data-i18n="navOther"></a>
        <a href="https://github.com/penndev/prism" target="_blank" rel="noopener">GitHub</a>
      </nav>
      <div class="lang">
        <button type="button" data-lang="zh-CN" aria-pressed="true">简体中文</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <img class="hero-logo" src="./logo.svg" width="72" height="72" alt="" />
        <h1>Prism</h1>
        <p class="lead" data-i18n="lead"></p>
      </section>

      <section id="download" class="block">
        <h2 data-i18n="downloadTitle"></h2>
        <div class="pager">
          <button type="button" id="rel-newer" disabled data-i18n="releaseNewer"></button>
          <p class="muted" id="release-meta" data-i18n="releaseLoading"></p>
          <button type="button" id="rel-older" disabled data-i18n="releaseOlder"></button>
        </div>
        <div class="cards">
          <article class="card">
            <h3 data-i18n="platformWin"></h3>
            <p data-i18n="winDesc"></p>
            <a class="btn" id="dl-windows" href="https://github.com/penndev/prism/releases" data-i18n="goReleases"></a>
            <details class="card-install">
              <summary data-i18n="installToggle"></summary>
              <ol data-i18n="installWinSteps"></ol>
              <p class="muted" data-i18n="installWinSign"></p>
            </details>
          </article>
          <article class="card">
            <h3 data-i18n="platformMac"></h3>
            <p data-i18n="macDesc"></p>
            <a class="btn" id="dl-darwin" href="https://github.com/penndev/prism/releases" data-i18n="goReleases"></a>
            <details class="card-install">
              <summary data-i18n="installToggle"></summary>
              <ol data-i18n="installMacSteps"></ol>
              <p class="muted" data-i18n="installMacSign"></p>
            </details>
          </article>
          <article class="card">
            <h3 data-i18n="platformAndroid"></h3>
            <p data-i18n="androidDesc"></p>
            <a class="btn" id="dl-android" href="https://github.com/penndev/prism/releases" data-i18n="goReleases"></a>
            <details class="card-install">
              <summary data-i18n="installToggle"></summary>
              <ol data-i18n="installAndroidSteps"></ol>
            </details>
          </article>
          <article class="card">
            <h3 data-i18n="platformIos"></h3>
            <p data-i18n="iosDesc"></p>
            <a class="btn" id="dl-ios" href="https://github.com/penndev/prism/releases" data-i18n="goReleases"></a>
            <details class="card-install">
              <summary data-i18n="installToggle"></summary>
              <ol data-i18n="installIosSteps"></ol>
              <p class="muted" data-i18n="installIosSign"></p>
            </details>
          </article>
        </div>
        <p class="muted" data-i18n="downloadHint"></p>
      </section>

      <section id="proxy" class="block">
        <h2 data-i18n="proxyTitle"></h2>
        <p data-i18n="proxyIntro"></p>
        <ol>
          <li data-i18n="proxyStep1"></li>
          <li data-i18n="proxyStep2"></li>
          <li data-i18n="proxyStep3"></li>
        </ol>

        <h3 data-i18n="proxyManualTitle"></h3>
        <p data-i18n="proxyManualLead"></p>
        <p data-i18n="localIntro"></p>
        <ul>
          <li data-i18n="localIp"></li>
          <li data-i18n="localPort"></li>
          <li data-i18n="localAuth"></li>
        </ul>
        <p data-i18n="localBrowser"></p>
        <p data-i18n="proxyManualDns"></p>

        <h3 data-i18n="proxyTunTitle"></h3>
        <p data-i18n="proxyTunLead"></p>
        <ul>
          <li data-i18n="proxyTunNeed"></li>
          <li data-i18n="proxyTunWin"></li>
          <li data-i18n="proxyTunDns"></li>
          <li data-i18n="proxyTunMobile"></li>
        </ul>
      </section>

      <section id="rules" class="block">
        <h2 data-i18n="ruleTitle"></h2>
        <p data-i18n="ruleOpen"></p>
        <p data-i18n="ruleOrder"></p>

        <h3 data-i18n="ruleDomainTitle"></h3>
        <p data-i18n="ruleDomain"></p>
        <ul>
          <li data-i18n="ruleDomainLine"></li>
          <li data-i18n="ruleDomainComment"></li>
          <li data-i18n="ruleDomainMatch"></li>
          <li data-i18n="ruleDomainNoUrl"></li>
        </ul>
        <p data-i18n="ruleDomainTun"></p>
        <p>
          <span data-i18n="ruleDomainHint"></span>
          <a href="https://penndev.github.io/prism/domain.txt">https://penndev.github.io/prism/domain.txt</a>
        </p>

        <h3 data-i18n="ruleGeoTitle"></h3>
        <p data-i18n="ruleGeo"></p>
        <ul>
          <li data-i18n="ruleGlobal"></li>
          <li data-i18n="ruleNone"></li>
          <li data-i18n="ruleProxy"></li>
          <li data-i18n="ruleBypass"></li>
        </ul>
        <p data-i18n="ruleDb"></p>
        <p>
          <span data-i18n="ruleDbHint"></span>
          <a href="https://github.com/penndev/gopkg/releases/download/ipregion-db/ipregion.db"
            >https://github.com/penndev/gopkg/releases/download/ipregion-db/ipregion.db</a
          >
        </p>
        <p data-i18n="ruleManual"></p>
      </section>

      <section id="other" class="block">
        <h2 data-i18n="otherTitle"></h2>

        <h3 data-i18n="nodeTitle"></h3>
        <p data-i18n="nodeIntro"></p>
        <ul>
          <li data-i18n="nodeHost"></li>
          <li data-i18n="nodeProto"></li>
          <li data-i18n="nodeAuth"></li>
          <li data-i18n="nodeRemark"></li>
        </ul>
        <p data-i18n="nodeSub"></p>

        <h3 data-i18n="otherSettingsTitle"></h3>
        <ul>
          <li data-i18n="otherPing"></li>
          <li data-i18n="otherSort"></li>
          <li data-i18n="otherTheme"></li>
          <li data-i18n="otherBoot"></li>
          <li data-i18n="otherLog"></li>
        </ul>

        <h3 data-i18n="faqTitle"></h3>
        <div class="faq">
          <details>
            <summary data-i18n="faqRuleQ"></summary>
            <p data-i18n="faqRuleA"></p>
          </details>
          <details>
            <summary data-i18n="faqTunQ"></summary>
            <p data-i18n="faqTunA"></p>
          </details>
          <details>
            <summary data-i18n="faqVpnQ"></summary>
            <p data-i18n="faqVpnA"></p>
          </details>
          <details>
            <summary data-i18n="faqSaveQ"></summary>
            <p data-i18n="faqSaveA"></p>
          </details>
          <details>
            <summary data-i18n="faqPingQ"></summary>
            <p data-i18n="faqPingA"></p>
          </details>
        </div>
      </section>
    </main>

    <footer>
      <span>Prism</span>
      <a href="https://github.com/penndev/prism" data-i18n="footerSource"></a>
      <a href="https://github.com/penndev/prism/releases" data-i18n="footerReleases"></a>
    </footer>

    <script src="./i18n.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
