<!DOCTYPE html>
<html lang="zh-CN" class="i18n-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    />
    <link rel="canonical" href="https://penndev.github.io/prism/" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <noscript>
      <style>
        html.i18n-pending main,
        html.i18n-pending footer {
          visibility: visible;
        }
      </style>
    </noscript>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#">
        <img src="./logo.svg" width="32" height="32" alt="" />
        <span>Prism</span>
      </a>
      <nav>
        <a href="#download" data-i18n="navDownload"></a>
        <a href="#proxy" data-i18n="navProxy"></a>
        <a href="#rules" data-i18n="navRules"></a>
        <a href="https://github.com/penndev/prism" target="_blank" rel="noopener">GitHub</a>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh-CN">中文</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </header>

    <main>
      <section id="download" class="hero">
        <img class="hero-logo" src="./logo.svg" width="96" height="96" alt="" />
        <h1>Prism</h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="os-row">
          <div>
            <a
              class="os-link"
              href="https://github.com/penndev/prism/releases/latest/download/Prism-windows-amd64-installer.exe"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">

                />

              <span>
                <strong data-i18n="platformWin"></strong>
                <small data-i18n="winDesc"></small>
              </span>
            </a>
            <details class="install">
              <summary data-i18n="installWinToggle"></summary>
              <ol data-i18n="installWinSteps"></ol>
              <p class="muted" data-i18n="installWinSign"></p>

          </div>
          <div>
            <a
              class="os-link"
              href="https://github.com/penndev/prism/releases/latest/download/Prism-darwin-arm64.pkg"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path

                />
              </svg>
              <span>
                <strong data-i18n="platformMac"></strong>
                <small data-i18n="macDesc"></small>
              </span>
            </a>
            <details class="install">
              <summary data-i18n="installMacToggle"></summary>
              <ol data-i18n="installMacSteps"></ol>
              <p class="muted" data-i18n="installMacSign"></p>
            </details>
          </div>
          <a class="os-link">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M17.6 9.5 16.3 8.2A6.4 6.4 0 0 0 12 6.6c-1.6 0-3 .5-4.2 1.5L6.4 6.7a.5.5 0 0 0-.7.7l1.2 1.2A6.9 6.9 0 0 0 5 13.5V14h14v-.5c0-1.6-.6-3.1-1.4-4zM9.2 12a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6zm5.6 0a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6zM6 15.2v2.3c0 .8.7 1.5 1.5 1.5h.8v2c0 .6.4 1 1 1s1-.4 1-1v-2h3.4v2c0 .6.4 1 1 1s1-.4 1-1v-2h.8c.8 0 1.5-.7 1.5-1.5v-2.3H6z"
              />
            </svg>
            <span>
              <strong data-i18n="platformAndroid"></strong>
              <small data-i18n="androidDesc"></small>
            </span>
          </a>
          <a class="os-link">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v14h8V4H8zm4 16.2a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"

            <span>

              <small data-i18n="iosDesc"></small>
            </span>
          </a>
        </div>

      <div class="assets">
        <section class="asset">
          <div>
            <h2 data-i18n="assetDomainTitle"></h2>
            <p data-i18n="assetDomainBody"></p>
          </div>
          <div class="asset-side">
            <a class="asset-dl" href="https://penndev.github.io/prism/domain.txt">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14"
                />
              </svg>
              domain.txt
            </a>
            <button type="button" class="copy-url">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  x="8"
                  y="8"
                  width="12"
                  height="12"
                  rx="2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                />
              </svg>
              <span data-i18n="assetCopy">复制网址</span>
            </button>
          </div>
        </section>

        <section class="asset">
          <div>
            <h2 data-i18n="assetGeoTitle"></h2>
            <p data-i18n="assetGeoBody"></p>
          </div>
          <div class="asset-side">
            <a
              class="asset-dl"
              href="https://github.com/penndev/gopkg/releases/download/ipregion-db/ipregion.db"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14"
                />
              </svg>
              ipregion.db
            </a>
            <button type="button" class="copy-url">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  x="8"
                  y="8"
                  width="12"
                  height="12"
                  rx="2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                />
              </svg>
              <span data-i18n="assetCopy">复制网址</span>
            </button>
          </div>
        </section>
      </div>

      <section id="proxy" class="block">
        <h2 data-i18n="proxyTitle"></h2>
        <p data-i18n="proxyIntro"></p>

        <h3 data-i18n="proxyManualTitle"></h3>
        <p data-i18n="proxyManualLead"></p>
        <p data-i18n="localIntro"></p>
        <ul>
          <li data-i18n="localIp"></li>
          <li data-i18n="localPort"></li>
          <li data-i18n="localAuth"></li>

        <p data-i18n="localBrowser"></p>

        <h3 data-i18n="proxyTunTitle"></h3>

        <p data-i18n="ruleOpen"></p>
        <p data-i18n="ruleOrder"></p>

        <ul>

          <li data-i18n="ruleDomainComment"></li>

        <h3 data-i18n="ruleGeoTitle"></h3>

            >https://github.com/penndev/gopkg/releases/download/ipregion-db/ipregion.db</a
