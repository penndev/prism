<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="titleDocument">规则管理</title>
  <link rel="icon" href="/subscribe/logo.png" type="image/png">
  <link rel="stylesheet" href="rule.css">
</head>
<body>
  <div class="page">
    <header class="page-head">
      <div class="brand">
        <img class="brand-logo" src="/subscribe/logo.png" width="38" height="38" alt="Prism">
        <div>
          <h1 id="titleMain">Prism 规则管理</h1>
          <p id="titleDesc">按类型分区管理：域名规则与地域规则。</p>
        </div>
      </div>
    </header>

    <section class="panel" id="domainSection">
      <h2 id="domainTitle">域名规则</h2>
      <p id="domainDesc" class="subline">填写需要代理的域名。不需要代理的域名不必填写，每行一个。</p>
      <div class="row">
        <input id="domainUrl" type="url" placeholder="https://…" spellcheck="false">
        <button id="btnDomainFetch" class="primary" type="button">获取</button>
      </div>
      <div class="row">
        <input id="domainFile" type="file" accept=".txt,.list,text/plain">
        <button id="btnDomainFile" type="button">上传文件</button>
      </div>
      <textarea id="domains" spellcheck="false" placeholder="example.com&#10;github.com"></textarea>
      <div class="row">
        <span id="domainMsg" class="muted"></span>
      </div>
    </section>

    <section class="panel" id="geoSection">
      <h2 id="geoTitle">地域规则</h2>
      <p id="geoDesc" class="subline">默认不做地域判断，这些连接都走代理。有 IP 库后，勾选的地区直连，其余仍走代理。</p>

        <div class="db-block">
          <div class="db-head">
            <span id="dbLabel" class="db-label">IP 库</span>
            <span class="db-actions">
              <button id="btnDeleteDb" type="button" hidden>删除</button>
              <button id="btnChangeDb" type="button" hidden>更换</button>
            </span>
          </div>
          <div id="dbStatus" class="status-box has-path-tip" title="">-</div>
          <div id="dbEditor" hidden>
            <div class="row">
              <input id="dbUrl" type="url" placeholder="" spellcheck="false">
              <button id="btnDownload" class="primary" type="button">下载</button>
            </div>
            <div class="row">
              <input id="dbFile" type="file" accept=".db,application/octet-stream">
              <button id="btnUpload" type="button">上传文件</button>
            </div>
          </div>
          <div class="row">
            <span id="dbMsg" class="muted"></span>
          </div>
        </div>

        <div id="areaPicker" class="area-picker" hidden>
          <div class="row">
            <button id="btnSelectAll" type="button">全选</button>
            <button id="btnInvert" type="button">反选</button>
            <input id="areaFilter" type="text" placeholder="搜索国家/地区">
            <span id="selectedCount" class="muted"></span>
          </div>
          <div id="areaChecks" class="area-checks"></div>
        </div>

      <div class="row">
        <span id="geoMsg" class="muted"></span>
      </div>
    </section>
  </div>

  <script src="/common/app-ui.js"></script>
  <script src="/common/i18n.js"></script>
  <script>
    const I18N = (window.WEB_I18N && window.WEB_I18N.rule) || {};
    const APP_CONFIG_DEFAULT = window.WebAppUI.APP_CONFIG_DEFAULT;
    const translate = window.WebAppUI.createTranslator(I18N, 'zh-CN');
    let currentLang = APP_CONFIG_DEFAULT.language;

    let areas = [];
    let areaIds = [];
    let expandedIds = new Set();
    let saveTimer = null;
    let saving = false;
    let pendingSave = null;
    let dbExists = false;
    let editingDb = false;

    const dbStatus = document.getElementById('dbStatus');
    const dbEditor = document.getElementById('dbEditor');
    const dbUrlEl = document.getElementById('dbUrl');
    const dbFileEl = document.getElementById('dbFile');
    const dbMsg = document.getElementById('dbMsg');
    const btnDeleteDb = document.getElementById('btnDeleteDb');
    const btnChangeDb = document.getElementById('btnChangeDb');
    const btnSelectAll = document.getElementById('btnSelectAll');
    const btnInvert = document.getElementById('btnInvert');
    const btnDownload = document.getElementById('btnDownload');
    const btnUpload = document.getElementById('btnUpload');
    const areaPicker = document.getElementById('areaPicker');
    const areaFilter = document.getElementById('areaFilter');
    const areaChecks = document.getElementById('areaChecks');
    const selectedCount = document.getElementById('selectedCount');
    const geoMsg = document.getElementById('geoMsg');
    const domainsEl = document.getElementById('domains');
    const domainUrlEl = document.getElementById('domainUrl');
    const domainFileEl = document.getElementById('domainFile');
    const btnDomainFetch = document.getElementById('btnDomainFetch');
    const btnDomainFile = document.getElementById('btnDomainFile');
    const domainMsg = document.getElementById('domainMsg');

    function t(key, params) {
      return translate(currentLang, key, params);
    }

    async function api(url, opt = {}) {
      const resp = await fetch(url, opt);
      if (!resp.ok) throw new Error(await resp.text());
      const ct = resp.headers.get('content-type') || '';
      if (ct.includes('application/json')) return await resp.json();
      return await resp.text();
    }

    async function loadAppConfig() {
      const cfg = await window.WebAppUI.fetchAppConfig(api);
      currentLang = window.WebAppUI.normalizeLanguage(I18N, cfg.language, 'zh-CN');
      window.WebAppUI.applyTheme(cfg.themeMode || APP_CONFIG_DEFAULT.themeMode);
    }

    function applyI18n() {
      document.documentElement.lang = currentLang;
      document.title = t('title.document');
      document.getElementById('titleMain').textContent = t('title.main');
      document.getElementById('titleDesc').textContent = t('title.desc');
      document.getElementById('geoTitle').textContent = t('geo.title');
      document.getElementById('geoDesc').textContent = t('geo.desc');
      document.getElementById('dbLabel').textContent = t('db.label');
      btnDeleteDb.textContent = t('button.delete');
      btnSelectAll.textContent = t('button.selectAll');
      btnInvert.textContent = t('button.invert');
      document.getElementById('domainTitle').textContent = t('domain.title');
      document.getElementById('domainDesc').textContent = t('domain.desc');
      domainsEl.placeholder = t('domain.placeholder');
      domainUrlEl.placeholder = t('domain.url.placeholder');
      btnDomainFetch.textContent = t('domain.fetch');
      btnDomainFile.textContent = t('domain.importFile');
      areaFilter.placeholder = t('area.filter');
      dbUrlEl.placeholder = t('db.url.placeholder');
      btnDownload.textContent = t('button.download');
      btnUpload.textContent = t('button.upload');
      if (dbExists) {
        btnChangeDb.textContent = editingDb ? t('button.cancel') : t('button.replace');
      }
      updateSelectedCount();
    }

    function syncModeUI() {
      areaPicker.hidden = !dbExists;
      renderAreaChecks();
      updateSelectedCount();
    }

    function selectedAreaIds() {
      return (Array.isArray(areaIds) ? areaIds : []).map(Number).filter((id) => id > 0);
    }

    function updateSelectedCount() {
      if (!dbExists) {
        selectedCount.textContent = '';
        return;
      }
      const n = selectedAreaIds().length;
      selectedCount.textContent = t('geo.selectedCount', { count: n });
    }

    function buildPayloadFromUI() {
      return {
        areaIds: dbExists ? selectedAreaIds() : [],
        domains: domainsEl.value || ''
      };
    }

    function nodeMatches(a, filter) {
      if (!filter) return true;
      const name = String(a.name || '').toLowerCase();
      if (name.includes(filter) || String(a.id).includes(filter)) return true;
      return (a.children || []).some((c) => nodeMatches(c, filter));
    }

    function seedExpanded(nodes, selected, ancestors) {
      for (const a of nodes || []) {
        const id = Number(a.id);
        seedExpanded(a.children || [], selected, ancestors.concat(id));
        if (selected.has(id)) {
          ancestors.forEach((pid) => expandedIds.add(pid));
        }
      }
    }

    function renderAreaNode(a, selected, filter, into, ancestorSelected) {
      if (filter && !nodeMatches(a, filter)) return;
      const children = Array.isArray(a.children) ? a.children : [];
      const id = Number(a.id);
      const open = filter
        ? children.some((c) => nodeMatches(c, filter))
        : expandedIds.has(id);
      const checked = ancestorSelected || selected.has(id);

      const node = document.createElement('div');
      node.className = 'area-node';
      const row = document.createElement('div');
      row.className = 'area-node-row';

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'area-toggle' + (children.length ? '' : ' is-empty');
      toggle.textContent = children.length && open ? '-' : '+';
      if (children.length) {
        toggle.addEventListener('click', (ev) => {
          ev.preventDefault();
          if (expandedIds.has(id)) expandedIds.delete(id);
          else expandedIds.add(id);
          renderAreaChecks();
        });
      }
      row.appendChild(toggle);

      const label = document.createElement('label');
      label.className = 'area-check';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = String(a.id);
      input.checked = checked;
      input.addEventListener('change', onAreaCheckChange);
      const span = document.createElement('span');
      span.textContent = String(a.name || '');
      label.appendChild(input);
      label.appendChild(span);
      row.appendChild(label);
      node.appendChild(row);

      if (children.length && open) {
        const sub = document.createElement('div');
        sub.className = 'area-children';
        for (const c of children) renderAreaNode(c, selected, filter, sub, checked);
        node.appendChild(sub);
      }
      into.appendChild(node);
    }

    function renderAreaChecks() {
      const filter = (areaFilter.value || '').trim().toLowerCase();
      const selected = new Set((Array.isArray(areaIds) ? areaIds : []).map(Number));

      areaChecks.innerHTML = '';
      for (const a of areas) {
        renderAreaNode(a, selected, filter, areaChecks, false);
      }
      updateSelectedCount();
    }

    function syncDbEditorUI() {
      btnDeleteDb.hidden = !dbExists;
      if (!dbExists) {
        btnChangeDb.hidden = true;
        dbEditor.hidden = false;
        return;
      }
      btnChangeDb.hidden = false;
      btnChangeDb.textContent = editingDb ? t('button.cancel') : t('button.replace');
      dbEditor.hidden = !editingDb;
    }

    function renderDbStatus(st) {
      dbExists = !!(st && typeof st === 'object');
      dbStatus.hidden = !dbExists;
      if (dbExists) {
        dbStatus.className = 'status-box ok';
        dbStatus.textContent = t('db.status.ready', {
          version: st.version || '-',
          remark: st.remark || '-',
          areas: st.areas || 0,
          v4: st.v4 || 0,
          v6: st.v6 || 0
        });
      } else {
        editingDb = false;
        dbStatus.textContent = '';
      }
      syncModeUI();
      syncDbEditorUI();
    }

    async function loadDb() {
      const st = await api('/rule/api/db');
      renderDbStatus(st);
      return st;
    }

    async function loadAreas() {
      try {
        areas = await api('/rule/api/areas');
        if (!Array.isArray(areas)) areas = [];
        seedExpanded(areas, new Set((areaIds || []).map(Number)), []);
        renderAreaChecks();
      } catch (e) {
        areas = [];
        renderAreaChecks();
        geoMsg.textContent = e.message;
      }
    }

    async function loadConfig() {
      const cfg = await api('/rule/api/config');
      areaIds = Array.isArray(cfg.areaIds) ? cfg.areaIds.map(Number).filter((id) => id > 0) : [];
      domainsEl.value = cfg.domains || '';
      syncModeUI();
    }

    async function saveConfig(payload, msgEl) {
      if (saving) {
        pendingSave = { payload, msgEl };
        return;
      }
      saving = true;
      const el = msgEl || geoMsg;
      el.textContent = t('status.saving');
      try {
        const res = await api('/rule/api/config', {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload)
        });
        areaIds = Array.isArray(res.areaIds) ? res.areaIds.map(Number).filter((id) => id > 0) : payload.areaIds;
        el.textContent = t('status.saved');
        updateSelectedCount();
      } catch (e) {
        el.textContent = e.message;
        throw e;
      } finally {
        saving = false;
        if (pendingSave) {
          const next = pendingSave;
          pendingSave = null;
          try {
            await saveConfig(next.payload, next.msgEl);
          } catch (_) {}
        }
      }
    }

    function scheduleSaveFromUI(msgEl) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          await saveConfig(buildPayloadFromUI(), msgEl);
        } catch (_) {}
      }, 200);
    }

    function selectAllAreas() {
      areaIds = (areas || []).map((a) => Number(a.id)).filter((id) => id > 0);
      renderAreaChecks();
      scheduleSaveFromUI(geoMsg);
    }

    function invertAreas() {
      const selected = new Set(selectedAreaIds());
      function covered(id) {
        const path = findPath(areas, id) || [];
        return path.some((n) => selected.has(Number(n.id)));
      }
      function subtreeHasSelection(node) {
        if (selected.has(Number(node.id))) return true;
        return (node.children || []).some(subtreeHasSelection);
      }
      const out = [];
      function walk(nodes) {
        for (const node of nodes || []) {
          const id = Number(node.id);
          const whole = !covered(id) && !subtreeHasSelection(node);
          if (whole) {
            if (id > 0) out.push(id);
          } else {
            walk(node.children);
          }
        }
      }
      walk(areas);
      areaIds = out;
      renderAreaChecks();
      scheduleSaveFromUI(geoMsg);
    }

    async function deleteDb() {
      btnDeleteDb.disabled = true;
      dbMsg.textContent = t('db.status.deleting');
      try {
        const res = await api('/rule/api/db', { method: 'DELETE' });
        editingDb = false;
        areas = [];
        areaIds = [];
        renderDbStatus(res.db || await api('/rule/api/db'));
        dbMsg.textContent = t('db.status.deleted');
        await loadConfig();
        syncModeUI();
      } catch (e) {
        dbMsg.textContent = e.message;
      } finally {
        btnDeleteDb.disabled = false;
      }
    }

    function collectIds(node) {
      const ids = [Number(node.id)];
      for (const c of node.children || []) ids.push(...collectIds(c));
      return ids;
    }

    function findNode(nodes, id) {
      for (const n of nodes || []) {
        if (Number(n.id) === id) return n;
        const found = findNode(n.children, id);
        if (found) return found;
      }
      return null;
    }

    function findPath(nodes, id, acc) {
      acc = acc || [];
      for (const n of nodes || []) {
        const next = acc.concat(n);
        if (Number(n.id) === id) return next;
        const found = findPath(n.children, id, next);
        if (found) return found;
      }
      return null;
    }

    function onAreaCheckChange(ev) {
      const id = Number(ev.target.value);
      const set = new Set(selectedAreaIds());
      if (ev.target.checked) {
        set.add(id);
      } else if (set.has(id)) {
        const node = findNode(areas, id);
        if (node) collectIds(node).forEach((x) => set.delete(x));
        else set.delete(id);
      } else {
        // 勾选的是祖先：拆开祖先，把旁支加回去，才能排除当前节点
        const path = findPath(areas, id) || [];
        for (let i = path.length - 1; i >= 0; i--) {
          const cur = path[i];
          const cid = Number(cur.id);
          if (!set.has(cid)) continue;
          set.delete(cid);
          const skip = i + 1 < path.length ? Number(path[i + 1].id) : id;
          for (const child of cur.children || []) {
            if (Number(child.id) !== skip) set.add(Number(child.id));
          }
        }
        const node = findNode(areas, id);
        if (node) collectIds(node).forEach((x) => set.delete(x));
      }
      areaIds = Array.from(set).filter((n) => n > 0);
      updateSelectedCount();
      scheduleSaveFromUI(geoMsg);
    }

    async function downloadDb() {
      const url = dbUrlEl.value.trim();
      if (!url) {
        dbMsg.textContent = t('db.error.noUrl');
        return;
      }
      btnDownload.disabled = true;
      dbMsg.textContent = t('db.status.downloading');
      try {
        const res = await api('/rule/api/db/download', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ url })
        });
        editingDb = false;
        renderDbStatus(res.db || await api('/rule/api/db'));
        dbMsg.textContent = t('db.status.downloaded');
        await loadAreas();
        await loadConfig();
        syncModeUI();
      } catch (e) {
        dbMsg.textContent = e.message;
      } finally {
        btnDownload.disabled = false;
      }
    }

    async function uploadDb() {
      const file = dbFileEl.files && dbFileEl.files[0];
      if (!file) {
        dbMsg.textContent = t('db.error.noFile');
        return;
      }
      btnUpload.disabled = true;
      dbMsg.textContent = t('db.status.uploading');
      try {
        const fd = new FormData();
        fd.append('file', file);
        const resp = await fetch('/rule/api/db/upload', { method: 'POST', body: fd });
        if (!resp.ok) throw new Error(await resp.text());
        const res = await resp.json();
        editingDb = false;
        renderDbStatus(res.db || await api('/rule/api/db'));
        dbMsg.textContent = t('db.status.uploaded');
        await loadAreas();
        await loadConfig();
        syncModeUI();
      } catch (e) {
        dbMsg.textContent = e.message;
      } finally {
        btnUpload.disabled = false;
      }
    }

    btnSelectAll.addEventListener('click', selectAllAreas);
    btnInvert.addEventListener('click', invertAreas);
    btnDeleteDb.addEventListener('click', deleteDb);
    domainsEl.addEventListener('input', () => {
      scheduleSaveFromUI(domainMsg);
    });
    areaFilter.addEventListener('input', renderAreaChecks);
    btnChangeDb.addEventListener('click', () => {
      editingDb = !editingDb;
      dbMsg.textContent = '';
      if (!editingDb) {
        dbUrlEl.value = '';
        dbFileEl.value = '';
      }
      syncDbEditorUI();
    });
    btnDownload.addEventListener('click', downloadDb);
    btnUpload.addEventListener('click', uploadDb);
    btnDomainFetch.addEventListener('click', async () => {
      const url = domainUrlEl.value.trim();
      if (!url) {
        domainMsg.textContent = t('domain.error.noUrl');
        return;
      }
      btnDomainFetch.disabled = true;
      try {
        const res = await api('/rule/api/fetch', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const body = String((res && res.text) || '').trim();
        if (!body) {
          domainMsg.textContent = t('domain.fetchError');
          return;
        }
        const cur = (domainsEl.value || '').trim();
        domainsEl.value = cur ? cur + '\n' + body : body;
        scheduleSaveFromUI(domainMsg);
      } catch (e) {
        domainMsg.textContent = t('domain.fetchError');
      } finally {
        btnDomainFetch.disabled = false;
      }
    });
    btnDomainFile.addEventListener('click', async () => {
      const file = domainFileEl.files && domainFileEl.files[0];
      if (!file) {
        domainMsg.textContent = t('db.error.noFile');
        return;
      }
      try {
        const text = await file.text();
        const body = String(text || '').trim();
        if (!body) {
          domainMsg.textContent = t('domain.error.emptyFile');
          return;
        }
        const cur = (domainsEl.value || '').trim();
        domainsEl.value = cur ? cur + '\n' + body : body;
        scheduleSaveFromUI(domainMsg);
      } catch (e) {
        domainMsg.textContent = t('domain.error.emptyFile');
      }
    });

    (async function bootstrap() {
      await loadAppConfig();
      applyI18n();
      try {
        const st = await loadDb();
        await loadConfig();
        if (st) {
          await loadAreas();
        }
        syncModeUI();
      } catch (e) {
        dbMsg.textContent = e.message;
      }
    })();
  </script>
</body>
</html>
